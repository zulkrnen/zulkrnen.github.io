<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syed Zulqarnain Haider</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, Outfit, Cinzel -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Outfit:wght@200;300;400;500;600;700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050608;
            --bg-card: rgba(12, 15, 22, 0.45);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-deep);
            color: #f1f5f9;
        }

        .font-signature {
            font-family: 'Cormorant Garamond', serif;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        /* Subtle Luxury Grain Layer */
        .grain-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
        }

        /* Smooth Radial Vignette */
        .vignette-overlay {
            background: radial-gradient(circle at center, transparent 30%, rgba(3, 4, 6, 0.85) 100%);
        }

        /* Soft Luxe Pulsing Opacity */
        @keyframes subtlePulse {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }

        .animate-luxe-pulse {
            animation: subtlePulse 5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Ultra-refined Glass Icon Buttons */
        .glass-btn {
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px -5px rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        /* Sophisticated Text Shimmer for Main Heading */
        .title-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Elegant Ambient Canvas */
        #ambient-canvas {
            filter: blur(80px);
            opacity: 0.65;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden relative select-none selection:bg-slate-700 selection:text-white">

    <!-- Deep Ambient Dynamic Canvas Background -->
    <canvas id="ambient-canvas" class="fixed inset-0 w-full h-full pointer-events-none -z-30"></canvas>

    <!-- Dark Vignette and Fine Noise Grain Layer -->
    <div class="fixed inset-0 vignette-overlay pointer-events-none -z-20"></div>
    <div class="fixed inset-0 grain-bg pointer-events-none -z-10"></div>

    <!-- Fullscreen Minimal Content Wrapper -->
    <div class="relative z-10 h-full w-full flex flex-col justify-between p-4 sm:p-6 md:p-8 lg:p-10">

        <!-- Header Navigation -->
        <header class="w-full flex items-center justify-between">
            <!-- Signature / Brand Logo on Top Left -->
            <a href="#" class="group flex items-center space-x-2 text-white focus:outline-none" aria-label="Zulkrnen Home">
                <span class="font-signature text-xs sm:text-sm md:text-base font-normal tracking-[0.25em] text-slate-300 group-hover:text-white transition-colors duration-500 uppercase">
                    Zulkrnen
                </span>
                <span class="w-1 h-1 rounded-full bg-slate-500 group-hover:bg-white group-hover:shadow-[0_0_8px_rgba(255,255,255,0.8)] transition-all duration-500"></span>
            </a>

            <!-- Subtle Minimalist Status Indicator -->
            <div class="hidden sm:flex items-center space-x-2 px-2.5 py-0.5 rounded-full glass-btn text-[8px] font-mono tracking-[0.2em] text-slate-400 uppercase">
                <span class="w-1 h-1 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.6)] animate-pulse"></span>
                <span>Private Preview</span>
            </div>
        </header>

        <!-- Main Headline Centerpiece -->
        <main class="flex-1 flex flex-col items-center justify-center text-center px-2 sm:px-4 my-auto">
            <div class="max-w-5xl mx-auto space-y-4 sm:space-y-6">
                
                <!-- Main Name Headline: 3-line stacked on mobile, single line on desktop -->
                <h1 class="font-light tracking-tight font-outfit uppercase title-gradient leading-none sm:leading-tight">
                    <span class="block sm:inline text-3xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl">Syed </span>
                    <span class="block sm:inline text-3xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl">Zulqarnain </span>
                    <span class="block sm:inline text-3xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl">Haider</span>
                </h1>

                <!-- Subtitle "Soon..." - Smaller & subtle -->
                <div class="pt-1">
                    <p class="font-cinzel text-xs sm:text-sm md:text-base font-light tracking-[0.75em] text-slate-400/80 uppercase animate-luxe-pulse">
                        Soon...
                    </p>
                </div>

            </div>
        </main>

        <!-- Footer Bar with Social Links -->
        <footer class="w-full flex flex-col sm:flex-row items-center justify-between gap-4 sm:gap-6 pt-4 sm:pt-6 border-t border-white/[0.05]">
            <!-- Left Side Minimal Email Contact -->
            <a href="mailto:zulkrnenHaider@proton.me" class="text-[11px] sm:text-xs text-slate-400 hover:text-white font-mono tracking-wider transition-colors duration-300 flex items-center gap-2 group">
                <span class="w-1.5 h-1.5 rounded-full bg-slate-500 group-hover:bg-cyan-400 group-hover:shadow-[0_0_8px_rgba(34,211,238,0.8)] transition-all duration-300"></span>
                <span>zulkrnenHaider@proton.me</span>
            </a>

            <!-- Right Side Socials: Text on desktop, Icon buttons on mobile -->
            <div class="flex items-center space-x-3 sm:space-x-6">
                <!-- Mail -->
                <a href="mailto:zulkrnenHaider@proton.me" target="_blank" rel="noopener noreferrer" aria-label="Mail"
                   class="group flex items-center">
                    <!-- Text for desktop -->
                    <span class="hidden sm:inline text-[10px] md:text-xs font-mono tracking-[0.2em] text-slate-400 group-hover:text-white uppercase transition-colors duration-300">Mail</span>
                    <!-- Icon for mobile -->
                    <div class="sm:hidden glass-btn w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white">
                        <i class="fa-solid fa-envelope text-[11px]"></i>
                    </div>
                </a>

                <!-- Instagram -->
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram"
                   class="group flex items-center">
                    <span class="hidden sm:inline text-[10px] md:text-xs font-mono tracking-[0.2em] text-slate-400 group-hover:text-white uppercase transition-colors duration-300">Insta</span>
                    <div class="sm:hidden glass-btn w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white">
                        <i class="fa-brands fa-instagram text-[11px]"></i>
                    </div>
                </a>

                <!-- WhatsApp -->
                <a href="https://whatsapp.com" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"
                   class="group flex items-center">
                    <span class="hidden sm:inline text-[10px] md:text-xs font-mono tracking-[0.2em] text-slate-400 group-hover:text-white uppercase transition-colors duration-300">Whatsapp</span>
                    <div class="sm:hidden glass-btn w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white">
                        <i class="fa-brands fa-whatsapp text-[11px]"></i>
                    </div>
                </a>

                <!-- LinkedIn -->
                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"
                   class="group flex items-center">
                    <span class="hidden sm:inline text-[10px] md:text-xs font-mono tracking-[0.2em] text-slate-400 group-hover:text-white uppercase transition-colors duration-300">LinkedIn</span>
                    <div class="sm:hidden glass-btn w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white">
                        <i class="fa-brands fa-linkedin-in text-[11px]"></i>
                    </div>
                </a>
            </div>
        </footer>

    </div>

    <!-- Smooth Interactive Ambient Glow Script -->
    <script>
        const canvas = document.getElementById('ambient-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            mouse.targetX = width / 2;
            mouse.targetY = height / 2;
            mouse.x = width / 2;
            mouse.y = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.targetX = e.touches[0].clientX;
                mouse.targetY = e.touches[0].clientY;
            }
        });

        // Deep moody ambient color Orbs (Understated Moody Tones)
        const orbs = [
            { x: width * 0.3, y: height * 0.4, vx: 0.3, vy: 0.2, radius: 450, color: 'rgba(20, 28, 45, 0.9)' },  /* Deep Indigo Slate */
            { x: width * 0.7, y: height * 0.6, vx: -0.2, vy: 0.3, radius: 500, color: 'rgba(12, 35, 40, 0.7)' }, /* Moody Midnight Emerald */
            { x: width * 0.5, y: height * 0.5, vx: 0.1, vy: -0.2, radius: 400, color: 'rgba(25, 20, 35, 0.8)' }  /* Dark Charcoal Purple */
        ];

        function animate() {
            // Smooth mouse interpolation (lerp)
            mouse.x += (mouse.targetX - mouse.x) * 0.03;
            mouse.y += (mouse.targetY - mouse.y) * 0.03;

            // Clear with deep base dark color #050608
            ctx.fillStyle = '#050608';
            ctx.fillRect(0, 0, width, height);

            // Draw drifting ambient background orbs
            orbs.forEach((orb, i) => {
                orb.x += orb.vx;
                orb.y += orb.vy;

                if (orb.x < -100 || orb.x > width + 100) orb.vx *= -1;
                if (orb.y < -100 || orb.y > height + 100) orb.vy *= -1;

                const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.radius);
                grad.addColorStop(0, orb.color);
                grad.addColorStop(1, 'rgba(5, 6, 8, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw subtle mouse-following ambient highlight
            const mouseGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 400);
            mouseGrad.addColorStop(0, 'rgba(56, 85, 128, 0.65)'); /* Brighter & richer ambient mouse backlight */
            mouseGrad.addColorStop(0.5, 'rgba(25, 45, 75, 0.30)');
            mouseGrad.addColorStop(1, 'rgba(5, 6, 8, 0)');

            ctx.fillStyle = mouseGrad;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 400, 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
